<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Mundial</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='satragno_front/style.css') }}">
</head>

<body class="mundial-wallpaper">

<div class="mundial-deco mundial-logo">🏆<br><span>2026</span></div>
<div class="mundial-deco mundial-ball">⚽</div>
<div class="mundial-deco mundial-cup">🏆</div>

<div class="mundial-ruleta-screen">
    <div class="stars">★ ★ ★</div>

    <h1 class="mundial-title">⚽ GIRA Y GANA ⚽</h1>
    <div class="mundial-subtitle">Mucha suerte</div>

    <div class="mundial-wheel-area">
        <div class="mundial-pointer"></div>

        <div class="mundial-light-ring">
            <svg id="wheel" class="mundial-wheel" viewBox="0 0 600 600">
                <g id="segments"></g>

                <circle cx="300" cy="300" r="82" fill="#003b9b" stroke="white" stroke-width="9"/>
                <text x="300" y="318" text-anchor="middle" fill="white" font-size="52" font-weight="900">YPF</text>
            </svg>
        </div>
    </div>

    <button class="mundial-spin" onclick="spinWheel()">⚽ GIRAR ⚽</button>

    <a class="mundial-back" href="/admin">Volver al panel</a>

    <div id="resultado" class="mundial-result" style="display:none;"></div>
</div>

<div id="modal-premio" class="promo-modal oculto">
    <div class="promo-modal-card mundial-modal-card">
        <h2>Resultado Mundial</h2>
        <img id="img-premio" src="" alt="Premio" class="promo-prize-image">
        <p id="texto-premio" class="promo-prize-text">Calculando...</p>

        <form id="formulario-datos" class="promo-claim-form">
            <p>Completa tus datos para recibir el codigo de canje.</p>
            <input type="text" id="nombre" placeholder="Nombre y Apellido" required>
            <input type="number" id="dni" placeholder="DNI" required>
            <input type="email" id="email" placeholder="Correo Electronico" required>
            <input type="tel" id="telefono" placeholder="Telefono" required>
            <button type="submit">Reclamar premio</button>
        </form>

        <button id="btn-cerrar-modal" class="promo-modal-action oculto">Finalizar</button>
    </div>
</div>

<script>
const ESTACION_ID = {{ estacion_id }};
let prizes = [];
let spinning = false;
let currentRotation = 0;
let velocidadRuleta = "{{ velocidad_ruleta }}";
let premioGanado = null;

const colors = [
    "#e52521",
    "#f7b500",
    "#008f39",
    "#005baa",
    "#6b35a5",
    "#f26c00"
];

function polar(cx, cy, r, angle) {
    let rad = (angle - 90) * Math.PI / 180;
    return {
        x: cx + r * Math.cos(rad),
        y: cy + r * Math.sin(rad)
    };
}

function slicePath(cx, cy, rOuter, rInner, start, end) {
    let p1 = polar(cx, cy, rOuter, start);
    let p2 = polar(cx, cy, rOuter, end);
    let p3 = polar(cx, cy, rInner, end);
    let p4 = polar(cx, cy, rInner, start);
    let large = (end - start) > 180 ? 1 : 0;

    return `
        M ${p1.x} ${p1.y}
        A ${rOuter} ${rOuter} 0 ${large} 1 ${p2.x} ${p2.y}
        L ${p3.x} ${p3.y}
        A ${rInner} ${rInner} 0 ${large} 0 ${p4.x} ${p4.y}
        Z
    `;
}

function getIcon(nombre) {
    nombre = nombre.toLowerCase();

    if (nombre.includes("cafe")) return "☕";
    if (nombre.includes("descuento")) return "🎟️";
    if (nombre.includes("invitacion")) return "🎁";
    if (nombre.includes("aliento")) return "🧣";
    if (nombre.includes("full")) return "🎁";
    if (nombre.includes("pelota")) return "⚽";
    if (nombre.includes("nada")) return "❌";

    return "🏆";
}

function drawWheel() {
    const group = document.getElementById("segments");
    group.innerHTML = "";

    if (prizes.length === 0) {
        prizes = [
            {nombre: "25% de descuento"},
            {nombre: "10% descuento tienda"},
            {nombre: "Cafe gratis"},
            {nombre: "Un aliento Full"},
            {nombre: "10% invitacion"}
        ];
    }

    const angle = 360 / prizes.length;

    prizes.forEach((p, i) => {
        let start = i * angle;
        let end = start + angle;
        let mid = start + angle / 2;

        let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", slicePath(300, 300, 255, 88, start, end));
        path.setAttribute("fill", colors[i % colors.length]);
        path.setAttribute("stroke", "white");
        path.setAttribute("stroke-width", "3");
        group.appendChild(path);

        let textPos = polar(300, 300, 175, mid);

        let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", textPos.x);
        text.setAttribute("y", textPos.y);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("fill", "white");
        text.setAttribute("font-size", prizes.length > 6 ? "20" : "24");
        text.setAttribute("font-weight", "900");
        text.setAttribute("dominant-baseline", "middle");

        let words = p.nombre.toUpperCase().split(" ").slice(0, 3);

        words.forEach((w, idx) => {
            let tspan = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
            tspan.setAttribute("x", textPos.x);
            tspan.setAttribute("dy", idx === 0 ? "-22" : "28");
            tspan.textContent = w;
            text.appendChild(tspan);
        });

        group.appendChild(text);

        let iconPos = polar(300, 300, 220, mid);

        let icon = document.createElementNS("http://www.w3.org/2000/svg", "text");
        icon.setAttribute("x", iconPos.x);
        icon.setAttribute("y", iconPos.y);
        icon.setAttribute("text-anchor", "middle");
        icon.setAttribute("font-size", "42");
        icon.setAttribute("dominant-baseline", "middle");
        icon.textContent = getIcon(p.nombre);
        group.appendChild(icon);
    });
}

function spinWheel() {
    if (spinning) return;
    spinning = true;

    fetch(`/girar/${ESTACION_ID}`, { method: "POST" })
    .then(res => res.json())
    .then(data => {
        premioGanado = data;
        const index = prizes.findIndex(p => p.nombre === data.nombre);
        const total = prizes.length;
        const anglePerPrize = 360 / total;

        let selectedIndex = index >= 0 ? index : 0;
        let targetAngle = 360 - (selectedIndex * anglePerPrize + anglePerPrize / 2);

        currentRotation += 360 * 6 + targetAngle;

        let duracion = "4s";
        let duracionMs = 4000;
        if (velocidadRuleta === "lenta") {
            duracion = "6s";
            duracionMs = 6000;
        }
        if (velocidadRuleta === "rapida") {
            duracion = "2.5s";
            duracionMs = 2500;
        }

        const wheel = document.getElementById("wheel");
        wheel.style.transition = `transform ${duracion} cubic-bezier(.12,.75,.22,1)`;
        wheel.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            mostrarModalPremio(data);
            spinning = false;
        }, duracionMs + 250);
    })
    .catch(() => {
        spinning = false;
        alert("Hubo un error de conexion al girar la ruleta.");
    });
}

function mostrarModalPremio(premio) {
    const modal = document.getElementById("modal-premio");
    const texto = document.getElementById("texto-premio");
    const formulario = document.getElementById("formulario-datos");
    const cerrar = document.getElementById("btn-cerrar-modal");
    const imagen = document.getElementById("img-premio");

    if (premio.imagen_url && premio.imagen_url.trim() !== "") {
        imagen.src = premio.imagen_url;
        imagen.style.display = "block";
    } else {
        imagen.style.display = "none";
    }

    modal.classList.remove("oculto");

    if (premio.sector === "NINGUNO") {
        texto.innerHTML = `<strong>${premio.nombre}</strong><br><span>Gracias por participar.</span>`;
        formulario.classList.add("oculto");
        cerrar.classList.remove("oculto");
    } else {
        texto.innerHTML = `Ganaste:<br><strong>${premio.nombre}</strong>`;
        formulario.classList.remove("oculto");
        cerrar.classList.add("oculto");
    }
}

document.getElementById("formulario-datos").addEventListener("submit", (event) => {
    event.preventDefault();
    const button = event.currentTarget.querySelector("button[type='submit']");
    button.disabled = true;
    button.innerText = "Procesando...";

    const datos = {
        nombre: document.getElementById("nombre").value,
        dni: document.getElementById("dni").value,
        email: document.getElementById("email").value,
        telefono: document.getElementById("telefono").value,
        premio: premioGanado.nombre,
        sector: premioGanado.sector
    };

    fetch(`/registrar/${ESTACION_ID}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
    })
    .then((res) => {
        if (!res.ok) throw new Error("No se pudo registrar.");
        event.currentTarget.innerHTML = `
            <div class="promo-success">
                <h3>Datos guardados con exito</h3>
                <p>Revisa tu correo electronico y la carpeta de spam para ver el codigo de canje.</p>
                <button onclick="window.location.reload()" type="button">Finalizar</button>
            </div>
        `;
    })
    .catch(() => {
        button.disabled = false;
        button.innerText = "Reclamar premio";
        document.getElementById("texto-premio").innerHTML += `<br><span class="promo-error">Error de conexion. Intenta de nuevo.</span>`;
    });
});

document.getElementById("btn-cerrar-modal").addEventListener("click", () => window.location.reload());

fetch(`/api/premios/${ESTACION_ID}`)
.then(res => res.json())
.then(data => {
    prizes = data;
    drawWheel();
});
</script>

</body>
</html>
