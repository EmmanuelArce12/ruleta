<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo Electrodomesticos - Login</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #eef2f7; color: #17202a; }
        .box { width: min(420px, calc(100% - 32px)); background: white; border-radius: 8px; padding: 28px; box-shadow: 0 16px 40px rgba(17, 24, 39, .14); }
        h1 { margin: 0 0 20px; font-size: 24px; color: #005cab; }
        label { display:block; font-size: 12px; font-weight: 700; text-transform: uppercase; margin: 12px 0 6px; }
        input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #c8d2df; border-radius: 6px; font-size: 15px; }
        button { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 6px; background: #005cab; color: white; font-weight: 700; cursor: pointer; }
        .error { background: #fdecea; color: #b42318; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <form class="box" method="POST">
        <h1>Sorteo Electrodomesticos</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <label>Usuario administrador</label>
        <input name="usuario" required autocomplete="username">
        <label>Contrasena</label>
        <input name="password" type="password" required autocomplete="current-password">
        <button type="submit">Ingresar</button>
    </form>
</body>
</html>
