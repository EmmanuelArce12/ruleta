<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo Electrodomesticos</title>
    <style>
        :root { --navy:#091a2b; --navy-soft:#102a43; --blue:#1d8fff; --sky:#0f3357; --paper:#0c1b2d; --paper-2:#12263b; --line:#24405f; --ink:#ecf4ff; --muted:#9ab0c7; --ok:#16a34a; --bad:#ea580c; --warn:#d97706; --violet:#8b5cf6; --card-shadow:0 22px 48px rgba(0, 0, 0, 0.32); }
        * { box-sizing:border-box; }
        body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:radial-gradient(circle at top left, rgba(29,143,255,0.22), transparent 24%), linear-gradient(180deg, #07111d 0%, #0d1d30 50%, #10253a 100%); }
        a { color:inherit; }
        .app-shell { min-height:100vh; padding:24px; }
        .hero { background:linear-gradient(135deg, #0a1624 0%, #12304f 52%, #1d4e80 100%); color:white; border:1px solid rgba(93, 156, 236, 0.28); border-radius:24px; padding:28px; box-shadow:var(--card-shadow); }
        .hero-top { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; flex-wrap:wrap; }
        .eyebrow { display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.14); font-size:12px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; }
        .hero h1 { margin:14px 0 6px; font-size:clamp(28px, 5vw, 42px); line-height:1.02; }
        .hero p { margin:0; max-width:860px; color:rgba(255,255,255,.86); line-height:1.5; }
        .hero-actions, .inline-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        .btn, .hero-actions a, .hero-actions button, .inline-actions a, .inline-actions button { appearance:none; border:1px solid transparent; border-radius:12px; padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 26px rgba(0,0,0,0.18); transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease, filter .16s ease; }
        .btn:hover, .hero-actions a:hover, .hero-actions button:hover, .inline-actions a:hover, .inline-actions button:hover { transform:translateY(-1px); filter:brightness(1.06); }
        .btn-xs { padding:8px 10px; font-size:12px; border-radius:10px; }
        .btn-primary { background:linear-gradient(135deg, #eff6ff, #bfdbfe); color:#08213d; border-color:#93c5fd; }
        .btn-secondary { background:rgba(5,12,24,0.38); color:white; border:1px solid rgba(255,255,255,0.22); }
        .btn-danger { background:linear-gradient(135deg, #c2410c, #fb923c); color:white; border-color:#fdba74; }
        .btn-success { background:linear-gradient(135deg, #15803d, #22c55e); color:white; border-color:#86efac; }
        .btn-dark { background:linear-gradient(135deg, #1e293b, #334155); color:white; border-color:#64748b; }
        .btn-violet { background:linear-gradient(135deg, #6d28d9, #8b5cf6); color:white; border-color:#c4b5fd; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-top:22px; }
        .stat-card { border-radius:18px; padding:18px; background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.14); backdrop-filter:blur(6px); }
        .stat-card strong { display:block; font-size:34px; margin-top:8px; }
        .stat-label { font-size:13px; color:rgba(255,255,255,0.82); }
        .content-shell { margin-top:22px; background:rgba(9,26,43,0.92); border:1px solid rgba(61,95,135,0.6); border-radius:24px; box-shadow:var(--card-shadow); overflow:hidden; }
        .tabs { display:flex; gap:10px; flex-wrap:wrap; padding:18px 18px 0; background:linear-gradient(180deg, rgba(15,35,58,0.96) 0%, rgba(10,27,45,0.98) 100%); border-bottom:1px solid var(--line); }
        .tab-btn { border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--muted); padding:12px 14px; border-radius:14px 14px 0 0; font-weight:700; cursor:pointer; min-width:120px; text-align:center; }
        .tab-btn.active { background:linear-gradient(180deg, #123457 0%, #0e2a46 100%); color:#ffffff; border-color:#4e8ed8; border-bottom-color:#0e2a46; box-shadow:0 8px 24px rgba(17, 77, 138, 0.34); }
        .panel { padding:22px; }
        .panel h2 { margin:0 0 8px; font-size:24px; color:var(--ink); }
        .panel-copy { margin:0 0 18px; color:var(--muted); line-height:1.5; }
        .cards-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; }
        .panel-card { background:linear-gradient(180deg, rgba(18,38,59,0.98) 0%, rgba(13,30,47,0.98) 100%); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 10px 24px rgba(0,0,0,0.18); }
        .panel-card h3 { margin:0 0 10px; font-size:17px; color:var(--ink); }
        .panel-card p { margin:0; color:var(--muted); line-height:1.45; }
        .stack { display:grid; gap:12px; }
        .field label { display:block; margin:0 0 6px; font-size:12px; font-weight:800; text-transform:uppercase; color:#b7cae0; letter-spacing:.4px; }
        .field input { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:12px; font-size:15px; background:#081521; color:var(--ink); }
        .glossary-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; }
        .glossary-item { border-radius:16px; padding:16px; border:1px solid var(--line); background:linear-gradient(180deg, rgba(10,23,37,0.98) 0%, rgba(13,30,47,0.98) 100%); }
        .glossary-item strong { display:inline-flex; min-width:38px; height:38px; border-radius:999px; align-items:center; justify-content:center; background:var(--sky); color:#8fd0ff; margin-bottom:10px; }
        .badge { display:inline-flex; align-items:center; justify-content:center; padding:5px 10px; border-radius:999px; color:white; font-size:12px; font-weight:800; }
        .badge.PENDIENTE { background:var(--warn); }
        .badge.APROBADO { background:var(--ok); }
        .badge.DENEGADO { background:var(--bad); }
        .badge.DUDOSO { background:var(--violet); }
        .table-shell { background:#0f2135; border:1px solid var(--line); border-radius:18px; overflow:hidden; }
        .table-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:16px 18px; border-bottom:1px solid var(--line); background:linear-gradient(180deg, #12263b 0%, #0e2032 100%); }
        .table-wrap { overflow:auto; }
        table { width:100%; min-width:1100px; border-collapse:collapse; }
        th, td { padding:12px 14px; border-bottom:1px solid #1e3a56; font-size:13px; text-align:left; vertical-align:top; }
        th { background:#16304a; color:#c6d6e7; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
        .icon-btn { min-width:38px; padding:8px 10px; }
        .invoice-inline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .date-inline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .invoice-inline input[type="text"] { width:150px; min-height:38px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font-size:13px; background:#081521; color:var(--ink); }
        .date-inline input[type="date"] { width:155px; min-height:38px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font-size:13px; background:#081521; color:var(--ink); }
        .row-check { width:18px; height:18px; accent-color:#22c55e; }
        .empty { padding:42px 20px; text-align:center; color:var(--muted); }
        .muted-note { color:var(--muted); font-size:13px; line-height:1.45; }
        .link-box { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:12px 14px; border-radius:14px; background:#081521; border:1px solid var(--line); }
        .qr-box { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
        .qr-box img { width:150px; height:150px; object-fit:contain; border-radius:16px; border:1px solid var(--line); background:white; padding:12px; }
        .modal-overlay { position:fixed; inset:0; background:rgba(3, 10, 18, 0.76); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:9999; }
        .modal-card { width:min(760px, 100%); max-height:min(80vh, 900px); overflow:auto; background:linear-gradient(180deg, #11263c 0%, #0b1b2d 100%); border:1px solid rgba(121, 168, 220, 0.34); border-radius:22px; box-shadow:0 32px 80px rgba(0,0,0,0.42); }
        .modal-header { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:20px 22px 14px; border-bottom:1px solid rgba(93, 130, 170, 0.26); }
        .modal-header h3 { margin:0; font-size:22px; color:var(--ink); }
        .modal-header p { margin:4px 0 0; color:var(--muted); line-height:1.45; }
        .modal-close { width:42px; height:42px; border-radius:12px; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.05); color:white; font-size:20px; font-weight:700; cursor:pointer; }
        .modal-body { padding:18px 22px 22px; display:grid; gap:16px; }
        .detail-meta { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; }
        .detail-chip { border-radius:14px; padding:12px 14px; background:#0a1726; border:1px solid var(--line); }
        .detail-chip strong { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:#9bb4ce; margin-bottom:6px; }
        .detail-list { display:grid; gap:10px; }
        .detail-row { border-radius:16px; padding:14px; background:rgba(8,21,33,0.92); border:1px solid rgba(53, 88, 123, 0.78); }
        .detail-row-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap; }
        .detail-row-title { font-weight:800; color:var(--ink); }
        .detail-row-subtitle { margin-top:4px; color:var(--muted); font-size:13px; }
        .detail-row-badges { display:flex; gap:8px; flex-wrap:wrap; }
        .detail-badge { display:inline-flex; align-items:center; border-radius:999px; padding:5px 10px; font-size:12px; font-weight:800; }
        .detail-badge.ok { background:rgba(22, 163, 74, 0.18); color:#86efac; border:1px solid rgba(34, 197, 94, 0.35); }
        .detail-badge.neutral { background:rgba(148, 163, 184, 0.12); color:#dbeafe; border:1px solid rgba(148, 163, 184, 0.22); }
        .detail-empty { border-radius:16px; padding:20px; background:#0a1726; border:1px solid var(--line); color:var(--muted); text-align:center; }
        .admin-notice { margin-top:16px; padding:13px 15px; border-radius:14px; background:rgba(147, 197, 253, 0.12); border:1px solid rgba(147, 197, 253, 0.28); color:#dbeafe; font-weight:700; }
        @media (max-width: 900px) { .app-shell { padding:14px; } .hero { border-radius:20px; padding:20px; } .content-shell { border-radius:20px; } .panel { padding:16px; } .tabs { padding:14px 14px 0; } .tab-btn { min-width:unset; flex:1 1 calc(50% - 10px); } }
        @media (max-width: 640px) { .hero-actions, .inline-actions { width:100%; } .hero-actions a, .hero-actions button, .inline-actions .btn { width:100%; } .tab-btn { flex:1 1 100%; border-radius:12px; } .tab-btn.active { border-bottom-color:var(--line); } }
    </style>
</head>
<body>
    <div id="admin-root"></div>
    <form id="config-form" action="{{ base_path }}/admin/config" method="POST" style="display:none;">
        <input type="hidden" name="minimo_litros" id="config-minimo-litros" value="{{ config['minimo_litros'] or 0 }}">
        <input type="hidden" name="consulta_automatica_hora" id="config-consulta-automatica-hora" value="{{ (config['consulta_automatica_hora'] and (config['consulta_automatica_hora']|string)[:5]) or '04:00' }}">
        <input type="hidden" name="promocion_desde" id="config-promocion-desde" value="{{ config['promocion_desde'] or '' }}">
        <input type="hidden" name="promocion_hasta" id="config-promocion-hasta" value="{{ config['promocion_hasta'] or '' }}">
    </form>
    <form id="promo-form" action="{{ base_path }}/admin/nueva-promocion" method="POST" style="display:none;">
        <input type="hidden" name="promocion_desde" id="promo-promocion-desde" value="{{ config['promocion_desde'] or '' }}">
        <input type="hidden" name="promocion_hasta" id="promo-promocion-hasta" value="{{ config['promocion_hasta'] or '' }}">
    </form>
    <form id="forzar-form" action="{{ base_path }}/admin/forzar-consulta" method="POST" style="display:none;"></form>
    <form id="detener-form" action="{{ base_path }}/admin/detener" method="POST" style="display:none;"></form>
    <form id="reanudar-form" action="{{ base_path }}/admin/reanudar" method="POST" style="display:none;"></form>
    {% for p in dudosos %}
    <form id="aprobar-dudoso-{{ p['id'] }}" action="{{ base_path }}/admin/dudoso/{{ p['id'] }}/aprobar" method="POST" style="display:none;"></form>
    <form id="denegar-dudoso-{{ p['id'] }}" action="{{ base_path }}/admin/dudoso/{{ p['id'] }}/denegar" method="POST" style="display:none;"></form>
    <form id="eliminar-participante-{{ p['id'] }}" action="{{ base_path }}/admin/participante/{{ p['id'] }}/eliminar" method="POST" style="display:none;"></form>
    {% endfor %}
    {% for p in denegados %}
    <form id="aprobar-denegado-{{ p['id'] }}" action="{{ base_path }}/admin/denegado/{{ p['id'] }}/aprobar" method="POST" style="display:none;"></form>
    <form id="eliminar-participante-{{ p['id'] }}" action="{{ base_path }}/admin/participante/{{ p['id'] }}/eliminar" method="POST" style="display:none;"></form>
    {% endfor %}
    {% for p in aprobados %}
    <form id="eliminar-participante-{{ p['id'] }}" action="{{ base_path }}/admin/participante/{{ p['id'] }}/eliminar" method="POST" style="display:none;"></form>
    {% endfor %}

    <script>
        window.SORTEO_ADMIN_DATA = {
            nombreEstacion: {{ nombre_estacion|tojson }},
            basePath: {{ base_path|tojson }},
            publicUrl: {{ public_url|tojson }},
            qr: {{ qr|tojson }},
            facturacionConfigurada: {{ facturacion_configurada|tojson }},
            sqlserverDriver: {{ sqlserver_driver|tojson }},
            estacion: { deboHost: {{ (estacion['debo_host'] or 'sin configurar')|tojson }}, deboAllowRemitos: {{ estacion['debo_allow_remitos']|tojson }} },
            adminNotice: {{ (admin_notice or '')|tojson }},
            config: {
                minimoLitros: {{ (config['minimo_litros'] or 0)|tojson }},
                consultaAutomaticaHora: {{ (((config['consulta_automatica_hora']|string)[:5]) if config['consulta_automatica_hora'] else '04:00')|tojson }},
                promocionDesde: {{ (config['promocion_desde'] and (config['promocion_desde']|string) or '')|tojson }},
                promocionHasta: {{ (config['promocion_hasta'] and (config['promocion_hasta']|string) or '')|tojson }},
                detenido: {{ config['detenido']|tojson }},
                ultimaConsulta: {{ (config['ultima_consulta'] and (config['ultima_consulta']|string))|tojson }}
            },
            totales: {{ totales|tojson }},
            sellerRanking: [{% for row in seller_ranking %}{ vendedor: {{ row['vendedor']|tojson }}, facturasAprobadas: {{ row['facturas_aprobadas']|tojson }} }{% if not loop.last %},{% endif %}{% endfor %}],
            pendientes: [{% for p in pendientes %}{ id: {{ p['id']|tojson }}, fecha: {{ (p['ticket_fecha']|string)|tojson }}, factura: {{ p['numero_factura']|tojson }}, cliente: {{ ((p['nombre'] ~ ' ' ~ p['apellido']) ~ (p['dni'] and (' / ' ~ p['dni']) or ''))|tojson }}, telefono: {{ p['telefono']|tojson }}, email: {{ p['email']|tojson }}, detalle: {{ (p['detalle_validacion'] or 'Esperando validacion.')|tojson }} }{% if not loop.last %},{% endif %}{% endfor %}],
            dudosos: [{% for p in dudosos %}{ id: {{ p['id']|tojson }}, fecha: {{ (p['ticket_fecha']|string)|tojson }}, fechaEditable: {{ (p['ticket_fecha']|string)|tojson }}, factura: {{ (p['factura_real'] or p['numero_factura'])|tojson }}, numeroFacturaEditable: {{ p['numero_factura']|tojson }}, vendedor: {{ (p['vendedor'] or '')|tojson }}, combustible: {{ (p['combustible'] or '')|tojson }}, litros: {{ (p['litros'] if p['litros'] is not none else '')|tojson }}, medioPago: {{ (p['medio_pago'] or '')|tojson }}, chances: {{ (p['chances'] or '')|tojson }}, deviceToken: {{ (p['device_token'] or '')|tojson }}, ip: {{ (p['ip_registro'] or '')|tojson }}, detalle: {{ (p['detalle_validacion'] or '')|tojson }}, composicionTicket: {{ (p['composicion_ticket'] or '')|tojson }}, cliente: {{ ((p['nombre'] ~ ' ' ~ p['apellido']) ~ (p['dni'] and (' / ' ~ p['dni']) or ''))|tojson }}, telefono: {{ p['telefono']|tojson }}, email: {{ p['email']|tojson }} }{% if not loop.last %},{% endif %}{% endfor %}],
            aprobados: [{% for p in aprobados %}{ id: {{ p['id']|tojson }}, estado: {{ p['estado']|tojson }}, fecha: {{ (p['ticket_fecha']|string)|tojson }}, factura: {{ (p['factura_real'] or p['numero_factura'])|tojson }}, tipo: {{ (((p['tipo_comprobante'] or '') ~ ' ' ~ (p['letra_fiscal'] or ''))|trim)|tojson }}, vendedor: {{ (p['vendedor'] or '')|tojson }}, combustible: {{ (p['combustible'] or '')|tojson }}, litros: {{ (p['litros'] if p['litros'] is not none else '')|tojson }}, medioPago: {{ (p['medio_pago'] or '')|tojson }}, appYpf: {{ yes_no_blank(p['pago_app_ypf'])|tojson }}, chances: {{ (p['chances'] or '')|tojson }}, cliente: {{ ((p['nombre'] ~ ' ' ~ p['apellido']) ~ (p['dni'] and (' / ' ~ p['dni']) or ''))|tojson }}, telefono: {{ p['telefono']|tojson }}, email: {{ p['email']|tojson }}, detalle: {{ (p['detalle_validacion'] or '')|tojson }} }{% if not loop.last %},{% endif %}{% endfor %}],
            denegados: [{% for p in denegados %}{ id: {{ p['id']|tojson }}, estado: {{ p['estado']|tojson }}, fecha: {{ (p['ticket_fecha']|string)|tojson }}, fechaEditable: {{ (p['ticket_fecha']|string)|tojson }}, factura: {{ (p['factura_real'] or p['numero_factura'])|tojson }}, numeroFacturaEditable: {{ p['numero_factura']|tojson }}, tipo: {{ (((p['tipo_comprobante'] or '') ~ ' ' ~ (p['letra_fiscal'] or ''))|trim)|tojson }}, vendedor: {{ (p['vendedor'] or '')|tojson }}, combustible: {{ (p['combustible'] or '')|tojson }}, litros: {{ (p['litros'] if p['litros'] is not none else '')|tojson }}, medioPago: {{ (p['medio_pago'] or '')|tojson }}, composicionTicket: {{ (p['composicion_ticket'] or '')|tojson }}, cliente: {{ ((p['nombre'] ~ ' ' ~ p['apellido']) ~ (p['dni'] and (' / ' ~ p['dni']) or ''))|tojson }}, telefono: {{ p['telefono']|tojson }}, email: {{ p['email']|tojson }}, detalle: {{ (p['detalle_validacion'] or '')|tojson }} }{% if not loop.last %},{% endif %}{% endfor %}],
            conteos: [{% for c in conteos %}{ id: {{ c['id']|tojson }}, fecha: {{ (c['iniciado_en'] and (c['iniciado_en']|string))|tojson }}, promocionDesde: {{ (c['promocion_desde'] and (c['promocion_desde']|string) or '')|tojson }}, promocionHasta: {{ (c['promocion_hasta'] and (c['promocion_hasta']|string) or '')|tojson }}, total: {{ c['total']|tojson }}, aprobados: {{ c['aprobados']|tojson }}, denegados: {{ c['denegados']|tojson }}, pendientes: {{ c['pendientes']|tojson }}, dudosos: {{ (c['dudosos'] or 0)|tojson }} }{% if not loop.last %},{% endif %}{% endfor %}]
        };
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
        (function () {
            if (!window.React || !window.ReactDOM || !window.SORTEO_ADMIN_DATA) return;
            const { useEffect, useState } = React;
            const e = React.createElement;
            const data = window.SORTEO_ADMIN_DATA;

            function submitForm(id) { const form = document.getElementById(id); if (form) form.submit(); }
            function exportHref(query) { return data.basePath + '/admin/exportar-excel' + query; }

            function InfoTable(props) {
                const rows = props.rows || [];
                return e('div', { className: 'table-shell' },
                    e('div', { className: 'table-toolbar' },
                        e('div', null, e('h3', { style: { margin: 0 } }, props.title), e('div', { className: 'muted-note' }, props.subtitle || '')),
                        props.toolbar || null
                    ),
                    rows.length
                        ? e('div', { className: 'table-wrap' },
                            e('table', null,
                                e('thead', null, e('tr', null, props.columns.map(function (col) { return e('th', { key: col.key }, col.label); }))),
                                e('tbody', null, rows.map(function (row, index) {
                                    return e('tr', { key: row.id || index }, props.columns.map(function (col) {
                                        return e('td', { key: col.key }, col.render ? col.render(row) : (row[col.key] ?? ''));
                                    }));
                                }))
                            )
                        )
                        : e('div', { className: 'empty' }, props.emptyText || 'No hay datos.')
                );
            }

            function normalizeInvoiceForEdit(value) {
                const raw = String(value || '');
                const parts = raw.split('-');
                const branchRaw = String(parts[0] || '').replace(/\D+/g, '');
                const serialRaw = String(parts.slice(1).join('') || '').replace(/\D+/g, '');
                let branch = branchRaw.replace(/^0+/, '');
                if (branch && branch.length > 2) branch = branch.replace(/0+$/, '') || branch;
                branch = branch.replace(/^0+/, '') || '0';
                const serial = serialRaw.replace(/^0+/, '') || '0';
                return branch + '-' + serial;
            }

            async function reprocessEditedInvoices(items) {
                const response = await window.fetch(data.basePath + '/admin/reprocesar-facturas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: items })
                });
                const payload = await response.json();
                if (!response.ok || !payload.ok) throw new Error((payload && payload.error) || 'No se pudo reprocesar.');
                return payload;
            }

            function formatCompositionDetails(row) {
                if (!row.composicionTicket) return 'Sin detalle de composicion guardado.';
                try {
                    const parsed = JSON.parse(row.composicionTicket);
                    const items = parsed.items || [];
                    if (!items.length) return 'Sin combustibles promocionales.';
                    return items.map(function (item) {
                        return item.combustible + ': ' + Number(item.litros || 0).toFixed(4) + ' lt';
                    }).join('\n');
                } catch (err) {
                    return row.composicionTicket;

                        factura: row.factura || '',

                    return;

            function EditableInvoiceReviewTab(props) {
                const [rows, setRows] = useState((props.rows || []).map(function (row) {
                    return Object.assign({}, row, { draftFactura: row.numeroFacturaEditable || row.factura || '', draftFecha: row.fechaEditable || row.fecha || '', editing: false, edited: false });
                }));
                const [selectedIds, setSelectedIds] = useState({});
                const [busy, setBusy] = useState(false);
                const [errorText, setErrorText] = useState('');
                const selectedItems = rows.filter(function (row) { return selectedIds[row.id]; });

                function updateRow(rowId, changes) {
                    setRows(function (current) {
                        return current.map(function (row) { return row.id === rowId ? Object.assign({}, row, changes) : row; });
                    });
                }

                function toggleSelect(row) {
                    setSelectedIds(function (current) {
                        const next = Object.assign({}, current);
                        if (next[row.id]) delete next[row.id];
                        else next[row.id] = true;
                        return next;
                    });
                }

                async function processSelected() {
                    if (!selectedItems.length || busy) return;
                    setBusy(true);
                    setErrorText('');
                    try {
                        const payload = await reprocessEditedInvoices(selectedItems.map(function (row) {
                            return { id: row.id, numero_factura: row.draftFactura, ticket_fecha: row.draftFecha };
                        }));
                        if (payload.errores && payload.errores.length) {
                            setErrorText(payload.errores.map(function (item) { return 'Fila ' + item.id + ': ' + item.error; }).join(' | '));
                        }
                        if (payload.actualizados && payload.actualizados.length) {
                            window.location.reload();
                        }
                    } catch (err) {
                        setErrorText(err.message || 'No se pudo reprocesar.');
                    } finally {
                        setBusy(false);
                    }
                }

                return e(InfoTable, {
                    title: props.title,
                    subtitle: props.subtitle,
                    rows: rows,
                    emptyText: props.emptyText,
                    toolbar: e('div', { className: 'inline-actions' },
                        props.exportButton,
                        e('button', { type: 'button', className: 'btn btn-success', disabled: !selectedItems.length || busy, onClick: processSelected, title: 'Reenvia las filas corregidas a pendientes para validarlas otra vez.' }, busy ? 'Reprocesando...' : 'Mandar a pendientes'),
                        errorText ? e('div', { className: 'muted-note', style: { maxWidth: '420px', color: '#fecaca' } }, errorText) : null
                    ),
                    columns: props.columns.concat([
                        {
                            key: 'fechaEditable',
                            label: 'Fecha',
                            render: function (row) {
                                return e('div', { className: 'date-inline' },
                                    row.editing
                                        ? e('input', { type: 'date', value: row.draftFecha, onChange: function (ev) { updateRow(row.id, { draftFecha: ev.target.value, edited: true }); } })
                                        : e('span', null, row.draftFecha || row.fecha),
                                    e('button', { type: 'button', className: 'btn btn-secondary btn-xs icon-btn', title: 'Editar fecha', onClick: function () { updateRow(row.id, { editing: !row.editing, draftFecha: row.draftFecha || row.fecha, draftFactura: normalizeInvoiceForEdit(row.draftFactura || row.factura) }); } }, 'Editar')
                                );
                            }
                        },
                        {
                            key: 'facturaEditable',
                            label: 'Factura',
                            render: function (row) {
                                return e('div', { className: 'invoice-inline' },
                                    row.editing
                                        ? e('input', { type: 'text', value: row.draftFactura, onChange: function (ev) { updateRow(row.id, { draftFactura: normalizeInvoiceForEdit(ev.target.value), edited: true }); } })
                                        : e('span', null, row.draftFactura || row.factura),
                                    e('button', { type: 'button', className: 'btn btn-secondary btn-xs icon-btn', title: 'Editar factura', onClick: function () { updateRow(row.id, { editing: !row.editing, draftFecha: row.draftFecha || row.fecha, draftFactura: normalizeInvoiceForEdit(row.draftFactura || row.factura) }); } }, 'Editar')
                                );
                            }
                        },
                        {
                            key: 'seleccion',
                            label: 'Seleccion',
                            render: function (row) {
                                return e('input', { type: 'checkbox', className: 'row-check', checked: !!selectedIds[row.id], onChange: function () { toggleSelect(row); }, title: 'Marcar para enviar a pendientes' });
                            }
                        },

                    ])
                });
            }

                const tabs = [{ id: 'overview', label: 'Resumen' }, { id: 'pendientes', label: 'Pendientes' }, { id: 'dudosos', label: 'Dudosos' }, { id: 'aprobados', label: 'Aprobados' }, { id: 'denegados', label: 'Denegadas' }, { id: 'ranking', label: 'Ranking' }, { id: 'archivados', label: 'Archivados' }];
                const panels = { overview: e(OverviewTab), pendientes: e(PendingTab), dudosos: e(SuspiciousTab), aprobados: e(ApprovedTab), denegados: e(DeniedTab), ranking: e(RankingTab), archivados: e(ArchiveTab) };
                const titles = { overview: ['Resumen', 'Configuracion, promocion activa, QR, controles y exportaciones.'], pendientes: ['Pendientes', 'Lo que todavia no fue consultado contra DEBO.'], dudosos: ['Dudosos', 'Casos a revisar manualmente antes de aprobar o denegar.'], aprobados: ['Aprobados', 'Participantes validos listos para el sorteo.'], denegados: ['Denegadas', 'Facturas rechazadas por litros, combustible o datos invalidos.'], ranking: ['Ranking', 'Conteo de vendedores por facturas aprobadas.'], archivados: ['Archivados', 'Historial de promociones anteriores con exportacion disponible.'] };
                useEffect(function () {
                    function handleOpen(event) {
                        setTicketDetail(event.detail || null);
                    }
                    function handleKeyDown(event) {
                        if (event.key === 'Escape') setTicketDetail(null);
                    }
                    window.addEventListener('sorteo:ticket-detail', handleOpen);
                    window.addEventListener('keydown', handleKeyDown);
                    return function () {
                        window.removeEventListener('sorteo:ticket-detail', handleOpen);
                        window.removeEventListener('keydown', handleKeyDown);
                    };
                }, []);
                return e('div', { className: 'app-shell' },
                    e('section', { className: 'hero' },
                        e('div', { className: 'hero-top' },
                            e('div', null,
                                e('div', { className: 'eyebrow' }, 'Sorteo', ' · ', data.config.detenido ? 'Detenido' : 'Activo'),
                                e('h1', null, data.nombreEstacion),
                                e('p', null, 'Validacion por fecha y factura. Los dispositivos que exceden el limite de cargas pasan a revision manual.')
                            ),
                            e('div', { className: 'hero-actions' }, e('a', { className: 'btn-danger', href: data.basePath + '/admin/logout' }, 'Salir'))
                        ),
                        e('div', { className: 'stats-grid' },
                            e('div', { className: 'stat-card' }, e('div', { className: 'stat-label' }, 'Pendientes'), e('strong', null, data.totales.pendientes)),
                            e('div', { className: 'stat-card' }, e('div', { className: 'stat-label' }, 'Dudosos'), e('strong', null, data.totales.dudosos)),
                            e('div', { className: 'stat-card' }, e('div', { className: 'stat-label' }, 'Aprobados'), e('strong', null, data.totales.aprobados)),
                            e('div', { className: 'stat-card' }, e('div', { className: 'stat-label' }, 'Denegados'), e('strong', null, data.totales.denegados))
                        ),
                        data.adminNotice ? e('div', { className: 'admin-notice' }, data.adminNotice) : null
                    ),
                    e('section', { className: 'content-shell' },
                        e('div', { className: 'tabs' }, tabs.map(function (item) { return e('button', { key: item.id, type: 'button', className: 'tab-btn' + (tab === item.id ? ' active' : ''), onClick: function () { setTab(item.id); } }, item.label); })),
                        e('div', { className: 'panel' }, e('h2', null, titles[tab][0]), e('p', { className: 'panel-copy' }, titles[tab][1]), panels[tab])
                    ),
                    e(TicketDetailModal, { detail: ticketDetail, onClose: function () { setTicketDetail(null); } })
                );
            }

            ReactDOM.createRoot(document.getElementById('admin-root')).render(e(AdminApp));
        })();
    </script>
</body>
</html>
